services:
  postgres:
    image: postgres:16-alpine
    container_name: hubigo-postgres
    environment:
      POSTGRES_USER: hubigo
      POSTGRES_PASSWORD: hubigo
      POSTGRES_DB: hubigo
    volumes:
      - hubigo-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubigo -d hubigo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: hubigo-app
    environment:
      DATABASE_URL: postgresql://hubigo:hubigo@postgres:5432/hubigo?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: development
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-hubigo}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      LOCAL_UPLOAD_DIR: ${LOCAL_UPLOAD_DIR:-uploads}
      HOSTFULLY_API_KEY: ${HOSTFULLY_API_KEY:-}
      HOSTFULLY_AGENCY_UID: ${HOSTFULLY_AGENCY_UID:-}
      HOSTFULLY_API_BASE_URL: ${HOSTFULLY_API_BASE_URL:-https://api.hostfully.com/api/v3.3}
      HOSTFULLY_WEBHOOK_SECRET: ${HOSTFULLY_WEBHOOK_SECRET:-}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:ops@hubigo.local}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy && npx prisma db seed && npm run dev",
      ]

volumes:
  hubigo-postgres-data:
